<!-- Lock screen for the published site. The whole app (markup, styles, code) is in the encrypted payload below;
     publish.py fills it in. This style tag is removed once the app is unlocked. -->
<style id="lock-style">
  :root{--paper:#ffffff;--ink:#111111;--muted:#5e5e5e;--accent:#111111;--accent-d:#000000;--on-accent:#ffffff;--line:#d6d6d6;--bad:#b3261e}
  .night{--paper:#0d0d0d;--ink:#f2f2f2;--muted:#a8a8a8;--accent:#f2f2f2;--accent-d:#8c8c8c;--on-accent:#0d0d0d;--line:#333333;--bad:#ff8a80}
  html,body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.5 'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif}
  #lock{position:fixed;inset:0;display:grid;place-items:center;padding:16px;box-sizing:border-box}
  #lock[hidden]{display:none}
  #lock .card{max-width:380px;width:100%;text-align:center}
  #lock h1{font-family:'Patrick Hand','Atkinson Hyperlegible',system-ui,sans-serif;font-size:48px;font-weight:400;margin:0 0 4px}
  #lock h1 span{color:var(--muted)}
  #lock p{color:var(--muted);margin:0 0 24px}
  #lock form{display:grid;gap:10px;text-align:left}
  #lock label{font-weight:700}
  #lock input[type=password]{width:100%;box-sizing:border-box;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
  #lock input[type=password]:focus{outline:3px solid var(--line);border-color:var(--accent)}
  #lock .rem{display:flex;align-items:center;gap:8px;font-weight:400;color:var(--muted)}
  #lock .rem input{width:20px;height:20px;accent-color:var(--accent);margin:0}
  #lock button{font:inherit;cursor:pointer;background:var(--accent);color:var(--on-accent);border:0;border-radius:14px;padding:14px 20px;font-weight:700;font-size:1.05rem;box-shadow:0 3px 0 var(--accent-d)}
  #lock button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-d)}
  #lock button:disabled{opacity:.6}
  #lock #msg{min-height:3em;text-align:center;color:var(--muted)}
  #lock #msg.bad{color:var(--bad);font-weight:700}
  #lock .shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
  @media (prefers-reduced-motion:reduce){#lock .shake{animation:none}}
</style>
</head>
<body>

<main id="lock" hidden>
  <div class="card">
    <h1>Study<span>Scroll</span></h1>
    <p>This app is private. Enter the access code to open it.</p>
    <form id="lock-form">
      <label for="code">Access code</label>
      <input id="code" type="password" required autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
      <label class="rem"><input id="remember" type="checkbox" checked> Remember on this device</label>
      <button type="submit">Unlock</button>
      <div id="msg" role="status" aria-live="polite"></div>
    </form>
  </div>
</main>

<script>
(async () => {
  const P = JSON.parse(document.getElementById('payload').textContent);
  const KEY = 'studyscroll:unlock'; // this device's saved key, so the code is only typed once
  const $ = (id) => document.getElementById(id);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const hex = (u) => Array.from(u, (b) => b.toString(16).padStart(2, '0')).join('');
  const unhex = (h) => new Uint8Array(h.match(/../g).map((x) => parseInt(x, 16)));

  // Same derivation as publish.py: PBKDF2-SHA256 -> 64 bytes (AES-256-CBC key, then HMAC-SHA256 key).
  async function derive(code) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code.normalize('NFC')), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(P.salt), iterations: P.iter }, base, 512));
  }
  // Returns the decrypted app, or null when the key is wrong (checked with the MAC before decrypting).
  async function open(bits) {
    const iv = b64(P.iv), ct = b64(P.ct), signed = new Uint8Array(iv.length + ct.length);
    signed.set(iv); signed.set(ct, iv.length);
    const mk = await crypto.subtle.importKey('raw', bits.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
    if (!(await crypto.subtle.verify('HMAC', mk, b64(P.mac), signed))) return null;
    const ek = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, ek, ct)));
  }

  // Swap the lock screen for the app, then load its modules from blob URLs, pointing each relative import at its dependency's blob.
  function run(app) {
    $('lock').remove(); $('lock-style').remove();
    const st = document.createElement('style'); st.textContent = app.css; document.head.appendChild(st);
    document.body.insertAdjacentHTML('afterbegin', app.html);
    const urls = {};
    const url = (path, chain = []) => {
      if (urls[path]) return urls[path];
      if (chain.includes(path)) throw new Error('Import cycle: ' + chain.concat(path).join(' -> '));
      if (!(path in app.files)) throw new Error('Missing module ' + path);
      const src = app.files[path].replace(/(\bfrom\s*|\bimport\s*\(?\s*)(['"])(\.{1,2}\/[^'"]+)\2/g,
        (m, pre, q, rel) => pre + q + url(new URL(rel, 'https://x/' + path).pathname.slice(1), chain.concat(path)) + q);
      return (urls[path] = URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    };
    const s = document.createElement('script'); s.type = 'module'; s.src = url(app.entry); document.body.appendChild(s);
  }

  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch { /* storage blocked */ }
  if (saved) {
    try { const app = await open(unhex(saved)); if (app) return run(app); } catch { /* fall through to the prompt */ }
    try { localStorage.removeItem(KEY); } catch { /* storage blocked */ } // the code was changed since this device unlocked
  }

  if (!window.crypto || !crypto.subtle) { $('lock').hidden = false; $('msg').textContent = 'This browser can’t unlock the app. Try Safari or Chrome.'; return; }
  $('lock').hidden = false; $('code').focus();
  $('lock-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button'), msg = $('msg'), card = document.querySelector('#lock .card');
    btn.disabled = true; msg.className = ''; msg.textContent = 'Unlocking…'; card.classList.remove('shake');
    try {
      const bits = await derive($('code').value.trim());
      const app = await open(bits);
      if (!app) {
        msg.className = 'bad'; msg.textContent = 'That code didn’t work. Try again.';
        void card.offsetWidth; card.classList.add('shake'); $('code').select();
        return;
      }
      if ($('remember').checked) { try { localStorage.setItem(KEY, hex(bits)); } catch { /* storage blocked */ } }
      run(app);
    } catch (err) {
      msg.className = 'bad'; msg.textContent = 'Something went wrong: ' + err.message;
    } finally { btn.disabled = false; }
  });
})();
</script>
</body>
</html>
